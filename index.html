<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGO Dimensions — 100% Checklist</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e6e2d8;
  --red:#d01012; --yellow:#ffcf00; --blue:#006cb7; --green:#00852b; --done:#e7f5ea;
  --pill-y:#fff1b8; --pill-o:#ffe0c2; --pill-r:#ffd6d6; --pill-t:#cdeeee; --pill-g:#e6e6e6;
  --pill-b:#d4e6f7; --pill-p:#e6dcf5; --pill-m:#f7d6ec; --pill-gr:#d6f0dc;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141416; --card:#1e1e22; --ink:#f2f2f3; --muted:#a0a0a8; --line:#33333a; --done:#183322;
    --pill-y:#4a3f10; --pill-o:#4d3218; --pill-r:#4d1f1f; --pill-t:#173f3f; --pill-g:#36363c;
    --pill-b:#18324d; --pill-p:#33264a; --pill-m:#4a1f3a; --pill-gr:#1d4026; }
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:22px 24px 0}
header h1{margin:0;font-size:26px;letter-spacing:-.3px}
header h1 .studs{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--yellow);box-shadow:18px 0 0 var(--yellow),36px 0 0 var(--yellow);margin-right:44px;vertical-align:2px}
header p{margin:4px 0 14px;opacity:.9}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:rgba(255,255,255,.15);color:#fff;padding:10px 14px;border-radius:10px 10px 0 0;font:600 14px system-ui;cursor:pointer;white-space:nowrap}
nav button.active{background:var(--bg);color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:20px}
section{display:none} section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .lbl{font-weight:600;font-size:13px;color:var(--muted)}
.stat .num{font-size:24px;font-weight:700;margin:2px 0 8px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#3cc06a);border-radius:6px;transition:width .3s}
.mini{height:6px;margin-top:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.toolbar select{padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px}
th{position:sticky;top:0;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#fff;padding:10px;z-index:1}
td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
tr.done td{background:var(--done)}
tr.done .strike{text-decoration:line-through;color:var(--muted)}
td.c{text-align:center} td.name{font-weight:650}
.small{font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ab{display:flex;flex-wrap:wrap;gap:4px}
.ab span{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.ab span.cx{background:none;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;border-radius:8px;outline:1px dashed var(--line);outline-offset:2px}
.ab span.cx i{font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.ab .ra{position:relative;font-weight:600}
.ab .r-none{background:var(--bg);color:var(--ink)}
.ti{display:inline-flex;width:46px;height:46px;border-radius:10px;background:var(--bg);border:2px solid var(--line);margin:2px;align-items:center;justify-content:center;vertical-align:middle;cursor:help;position:relative;transition:transform .1s}
.ti:hover{transform:scale(1.12);z-index:2}
.ti img{width:40px;height:40px;object-fit:contain}
.ti.tv{background:rgba(217,115,13,.12);border-color:rgba(217,115,13,.45)}
.ti.key{border-color:#f5b400;box-shadow:0 0 0 2px #f5b400}
.ti.swap{border-style:dashed;opacity:.8}
.ti .tfallback{width:36px;height:36px;font-size:12px;margin:0}
.ti.tv .tfallback{background:var(--pill-b)}
.iconrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.iconrow .sep{font-size:12px;color:var(--muted);margin:0 6px}
#tiptip h4 img{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:6px}
#tiptip .tsec img{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:4px}
.toy{display:inline-block;font-size:13px;padding:3px 8px;margin:2px;border-radius:8px;background:var(--pill-y);font-weight:600}
.toy.key{background:var(--yellow);color:#1d1d1f}
.toy.veh{background:var(--pill-b)}
.toy.swap{background:var(--pill-g);font-weight:500}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer;vertical-align:middle}
.chhead td{background:var(--bg);font-weight:700;font-size:13px;padding:8px 10px}
.notes dt{font-weight:700;margin-top:8px} .notes dd{margin:2px 0 0 0;color:var(--muted)}
a{color:var(--blue)}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.entry.done{border-color:var(--green);background:var(--done)}
.entry summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px}
.entry summary::-webkit-details-marker{display:none}
.entry summary .t{font-weight:700;font-size:16px}
.entry summary .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.entry summary .prog{font-weight:700;font-size:14px;text-align:right;min-width:90px}
.entry summary .chev{color:var(--muted);font-size:12px}
.entry[open] summary{border-bottom:1px solid var(--line)}
.body{padding:12px 16px 16px}
.body h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px}
.items{width:100%;min-width:0;border-collapse:collapse}
.items td{padding:7px 8px;font-size:14px}
.items tr.got td{opacity:.55}
.items tr.got .lbl{text-decoration:line-through}
.items .lbl{font-weight:600;white-space:nowrap}
.kind{font-size:11px}
.tierrow{display:grid;grid-template-columns:64px 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin:4px auto 2px;width:70px}.sbar i{display:block;height:100%}
#tiptip{position:fixed;z-index:50;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px;pointer-events:none;display:none;font-size:13px}
#tiptip.pin{pointer-events:auto;max-height:calc(100vh - 16px);overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35);border-color:var(--blue)}
#tiptip .pinbar{display:none;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:-4px 0 8px}
#tiptip.pin .pinbar{display:flex}#tiptip.pin .hint{display:none}
#tiptip .pinbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:2px 8px;cursor:pointer;font:inherit}
#tiptip details.cd{margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
#tiptip details.cd summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
#tiptip details.cd summary::-webkit-details-marker{display:none}
#tiptip details.cd summary::after{content:"▸";color:var(--muted);transition:transform .15s}#tiptip details.cd[open] summary::after{transform:rotate(90deg)}
#tiptip .hint{font-size:11px;color:var(--muted);margin-top:8px;font-style:italic}
#tiptip.wide{max-width:700px;width:700px}
#tiptip .tcols{display:grid;grid-template-columns:1fr 250px;gap:16px}
#tiptip .calc{border-left:1px solid var(--line);padding-left:14px;font-size:12px}
#tiptip .calc table{width:100%;min-width:0;border-collapse:collapse;table-layout:auto;margin:0}#tiptip .calc td{padding:1px 0;vertical-align:top;border:none;background:none;font-size:12px}#tiptip .calc td.n{text-align:right;white-space:nowrap;padding-left:6px;font-variant-numeric:tabular-nums}
#tiptip .calc .tot td{border-top:1px solid var(--line);font-weight:700;padding-top:3px}
#tiptip .calc .hd{font-weight:700;margin-top:8px}#tiptip .calc .zero td{color:var(--muted)}
@media (max-width:760px){#tiptip.wide{width:auto;max-width:94vw}#tiptip .tcols{grid-template-columns:1fr}#tiptip .calc{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:6px}}
#tiptip h4{margin:0 0 2px;font-size:15px}#tiptip .tsec{margin-top:8px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tabs2{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tabs2 span{border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;border:1px solid;color:var(--ink);position:relative}
:is(.tabs2,.ab) .r-common{background:#d1d5db;border-color:#9ca3af;color:#1f2937}
:is(.tabs2,.ab) .r-uncommon{background:#16a34a;border-color:#15803d;color:#fff}
:is(.tabs2,.ab) .r-rare{background:#2563eb;border-color:#1d4ed8;color:#fff}
:is(.tabs2,.ab) .r-epic{background:#9333ea;border-color:#7e22ce;color:#fff;box-shadow:0 0 5px rgba(168,85,247,.6)}
:is(.tabs2,.ab) .r-legend{background:linear-gradient(110deg,#b8860b 0%,#ffd700 30%,#fff6c2 45%,#ffd700 60%,#b8860b 100%);background-size:250% 100%;border-color:#e0a800;color:#3a2a00;font-weight:700;
  box-shadow:0 0 6px rgba(255,200,0,.7);animation:shine 2.2s linear infinite;overflow:visible}
:is(.tabs2,.ab) .r-legend::before,:is(.tabs2,.ab) .r-legend::after{content:"✦";position:absolute;font-size:9px;color:#fff8c8;text-shadow:0 0 4px #ffd700;animation:twinkle 1.4s ease-in-out infinite}
:is(.tabs2,.ab) .r-legend::before{top:-6px;right:-3px}:is(.tabs2,.ab) .r-legend::after{bottom:-6px;left:-2px;animation-delay:.7s}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){:is(.tabs2,.ab) .r-legend,:is(.tabs2,.ab) .r-legend::before,:is(.tabs2,.ab) .r-legend::after{animation:none}}
.rarlegend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.rarlegend span{font-size:13px;padding:4px 10px}
#tiptip .rcount{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
#tiptip .rcount span{font-size:12px}#tiptip .rcount span.zero{opacity:.3;box-shadow:none;animation:none}#tiptip .rcount span.zero::before,#tiptip .rcount span.zero::after{display:none}
#tiptip .builds{font-size:12px;color:var(--muted);margin-top:2px}
.tierlbl{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#1d1d1f}
.tiercards{display:flex;flex-wrap:wrap;gap:8px;padding:10px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);width:132px;cursor:pointer;text-align:center;transition:transform .12s}
.tcard:hover{transform:translateY(-2px)}
.ticon{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 4px}
.tfallback{width:72px;height:72px;margin:0 auto 4px;border-radius:50%;background:var(--pill-y);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#1d1d1f}
.rowicon{width:40px;height:40px;object-fit:contain;vertical-align:middle;margin-right:8px;float:left}
.tfallback.small-fb{width:40px;height:40px;font-size:14px;float:left;margin:0 8px 0 0}
.tcard b{display:block;font-size:13px;line-height:1.25} .tcard .small{font-size:12px}
.tcard.sel{outline:2px solid var(--blue)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.legend span{margin-right:10px}
</style>
</head>

const KEY = "ld100-route-v3";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "null") || null; } catch(e) { state = null; }
if (!state) { state = {}; migrate(); }

function migrate(){
  for (const k of ["ld100-checklist-v2","ld100-checklist-v1"]) {
    let old = {}; try { old = JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch(e) {}
    for (const id of Object.keys(old)) if (old[id] && /^r\d+$/.test(id)) state[id] = true;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const money = n => (typeof n === "number") ? n.toLocaleString("en-US") : esc(n);

const stepDone = (kind, ref) => DATA.route.some((r,i)=>r.kind===kind && r.ref===ref && state["r"+i]);

const TIERC = {S:"#ff7a7a",A:"#ffb36b",B:"#ffe066",C:"#8fdc8f",D:"#7cc4ff",F:"#c9c9cf"};

      <details class="cd" data-k="a"${OPEN.a?" open":""}><summary style="color:#006cb7">Abilities · ${r.a}</summary><div class="small" style="margin:2px 0 4px">Each requirement is worth 1 ÷ the number of toys that can meet it.</div>${btab(r.a_b, !r.starter&&r.a_base[0]?[`${r.a_base[0]} the Starter Pack can already meet (×${r.penalty})`,r.a_base[1]]:null)}${r.combo[0]?`<div class="small" style="margin-top:4px">Includes ${r.combo[0]} that need a combination on one toy, counted ×${r.combo_mult} (+${r.combo[1]}): ${esc(r.combo[2].join(", "))}${r.combo[2].length>=6?"…":""}</div>`:""}
</details>
      <details class="cd" data-k="v"${OPEN.v?" open":""}><summary style="color:#d9730d">Vehicles · ${r.v}</summary>${r.vehicles.length?btab(r.v_b, r.v_base[0]?[`${r.v_base[0]} the Starter Pack can already meet (×${r.penalty})`,r.v_base[1]]:null)+(r.v_combo[0]?`<div class="small" style="margin-top:4px">Includes ${r.v_combo[0]} that need a combination on the vehicle, counted ×${r.combo_mult} (+${r.v_combo[1]}): ${esc(r.v_combo[2].join(", "))}</div>`:"")+(r.v_overlap?`<div class="small">${r.v_overlap} more the character can already meet itself aren't counted again.</div>`:"")+(r.share>1?`<div class="small">Split ${r.share} ways with the pack's other character${r.share>2?"s":""}.</div>`:""):'<div class="small">No vehicle of its own.</div>'}
</details>
      <details class="cd" data-k="c"${OPEN.c?" open":""}><summary style="color:#7a3db8">Exclusive content · ${r.c}</summary>${r.unlocks.length?`<table>${r.unlocks.map(u=>`<tr><td>${esc(u[0])}</td><td class="n">${DATA.tiers.content_w} ÷ ${u[2]}${u[3]<1?` × ${u[3]}`:""} = ${(DATA.tiers.content_w/u[2]*u[3]).toFixed(1)}</td></tr>`).join("")}</table>${(()=>{const mates=Object.entries(DATA.toys).filter(([m,t])=>!t.v&&t.pack===r.pack&&m!==r.name).map(([m])=>m); return mates.length&&r.unlocks.some(u=>u[1]==="level")?`<div class="small" style="margin-top:4px">The levels need ${esc(r.name)} and ${esc(mates.join(" and "))} on the pad together, so each gets the full 4.</div>`:"";})()}${r.unlocks.some(u=>u[3]<1)?`<div class="small" style="margin-top:4px">×${r.penalty}: a Starter Pack character can open this too.</div>`:""}${/^(Abby Yates|Peter Venkman)$/.test(r.name)?`<div class="small" style="margin-top:4px">Abby and Peter can each open both Ghostbusters worlds.</div>`:""}`:'<div class="small">Unlocks nothing on its own.</div>'}</details></div>`;
    return `<div class="pinbar"><span>📌 Pinned</span><span>${document.querySelector(`#tab-tiers tr[data-name="${CSS.escape(n)}"]`)?`<button data-jumprow="${esc(n)}">Show in ranking table</button> `:""}<button data-unpin>✕ Close</button></span></div><div class="tcols"><div><h4>${img(n)}${esc(r.name)}</h4><div class="small">${esc(r.pack)} · Tier ${r.tier} · score ${r.score}</div>${counts([...r.abs,...r.vabs.flatMap(v=>v[1])])}
      <div class="tsec" style="color:#006cb7">Abilities (${r.abs.length})</div>${tags(r.abs)}${r.form?`<div class="small" style="margin-top:4px">${esc(r.form)}</div>`:""}
      ${r.vabs.length?r.vabs.map(v=>vsec(v[0],v[1],v[2],v[3])).join(""):'<div class="tsec" style="color:#d9730d">Vehicles</div><div class="small">None of their own</div>'}
      ${r.vabs.some(v=>v[0]==="Batwing")?`<div class="small" style="margin-top:6px">The Batwing is shared between Robin and Batgirl.</div>`:""}</div>${calc}</div>`;
  }
  let cur=null, pinned=false;
  const place=(x,y)=>{const w=tip.offsetWidth,h=tip.offsetHeight; let L=x+16,T=y+16;
    if(L+w>innerWidth-8) L=Math.max(8,x-w-16); if(T+h>innerHeight-8) T=Math.max(8,innerHeight-h-8); tip.style.left=L+"px"; tip.style.top=T+"px";};
  const open=(el,x,y)=>{const n=el.dataset.toy||el.dataset.jump; if(cur!==n){tip.innerHTML=card(n); tip.classList.toggle("wide",!!(byName[n]&&DATA.toys[n]&&!DATA.toys[n].v)); cur=n;} tip.style.display="block"; place(x,y);};
  const close=()=>{tip.style.display="none"; tip.classList.remove("pin"); pinned=false; cur=null;};
  const hit=e=>e.target.closest&&e.target.closest(".tcard,[data-toy]");
  document.addEventListener("mouseover",e=>{ if(pinned) return; const el=hit(e); if(el) open(el,e.clientX,e.clientY); else if(e.pointerType!=="touch") close();});
  document.addEventListener("mousemove",e=>{ if(!pinned&&tip.style.display==="block"&&hit(e)) place(e.clientX,e.clientY); });
  document.addEventListener("focusin",e=>{ if(pinned) return; const el=hit(e); if(el){const b=el.getBoundingClientRect(); open(el,b.right,b.top);} else close();});
  document.addEventListener("click",e=>{
    if(tip.contains(e.target)){
      const j=e.target.closest("[data-jumprow]"); if(j){ const tr=document.querySelector(`#tab-tiers tr[data-name="${CSS.escape(j.dataset.jumprow)}"]`); close(); if(tr){ tr.scrollIntoView({behavior:"smooth",block:"center"}); tr.style.outline="2px solid var(--blue)"; setTimeout(()=>tr.style.outline="",1600);} return; }
      if(e.target.closest("[data-unpin]")) close();
      return; }
    const el=hit(e);
    if(el){ e.preventDefault(); const n=el.dataset.toy||el.dataset.jump; if(pinned&&cur===n){close();return;} pinned=false; tip.classList.remove("pin"); open(el,e.clientX,e.clientY); pinned=true; tip.classList.add("pin"); place(e.clientX,e.clientY); }
    else if(pinned) close();
  }, true);
  tip.addEventListener("toggle",e=>{ const d=e.target; if(d.dataset&&d.dataset.k){ OPEN[d.dataset.k]=d.open; const r=tip.getBoundingClientRect(); if(r.bottom>innerHeight-8) tip.style.top=Math.max(8,innerHeight-tip.offsetHeight-8)+"px"; } }, true);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&tip.style.display==="block") close(); });
  document.addEventListener("scroll",e=>{ if(!pinned||!tip.contains(e.target)) { if(!pinned) close(); } },true);
})();
</script>
</body>
</html>
